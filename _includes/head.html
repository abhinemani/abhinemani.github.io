<head>
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta property="og:title" content="{{ page.title }} | {{ site.title }}" />
	<meta property="og:description" content="{{ page.subhead }}" />
	{% if page.categories contains "Academy" %}
	<meta name="twitter:image" content="{{ site.url }}/img/pia-social.jpg">
	<meta property="og:image" content="{{ site.url }}/img/pia-social.jpg" />
	{% else %}	{% if page.img contains ".png" or page.img contains ".jpg" %}
	<meta property="og:image" content="{{ site.url }}/img/{{ page.img }}" />
	<meta name="twitter:image" content="{{ site.url }}/img/{{ page.img }}">
	{% else %}
	<meta property="og:image" content="{{ site.url }}/img/placeholder.jpg" />
	<meta name="twitter:image" content="{{ site.url }}/img/placeholder.jpg">
	{% endif %}	{% endif %}
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:site" content="@abhinemani">
	<meta name="twitter:creator" content="@abhinemani">
	<meta name="twitter:title" content="{{ page.title }}">
	<meta name="twitter:description" content="{{ page.subhead }} ">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Preload hero background image for LCP optimization -->
    <link rel="preload" as="image" href="{{ site.url}}/img/abhi-rose.jpg" fetchpriority="high">

    <!-- Critical CSS for above-the-fold content (LCP optimization) -->
    <style>*{box-sizing:border-box}body{margin:0;padding:0;font-family:'Roboto',sans-serif;font-weight:400;color:#1D1D1D}.wrap{width:100%;max-width:1200px;float:none;margin:0 auto}.wrap_float{display:block;float:left;width:100%}.wrap-center{max-width:744px}.section-content{display:block;float:left;width:100%}.banner-section{display:block;float:left;width:100%;background-position:center center;background-repeat:no-repeat;background-size:cover;background-attachment:fixed;position:relative}.banner-section:before{position:absolute;content:'';top:0;left:0;width:100%;height:100%;opacity:.6;z-index:2;background:linear-gradient(to bottom,#000 0%,rgba(0,0,0,0) 100%)}.banner-section:after{position:absolute;content:'';bottom:0;left:0;width:100%;height:100%;background:linear-gradient(to bottom,rgba(255,255,255,0) 50%,#fff 100%)}.banner-section .wrap_float{min-height:750px;padding:100px 0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:3}.banner-section .location{margin-bottom:10px}.banner-section .page-title{color:#fff}.page-title{display:block;float:left;width:100%;font-size:50px;font-family:'Roboto',sans-serif;font-weight:700;line-height:56px;margin-bottom:27px}.location{font-size:18px;line-height:28px;color:#fff;padding-left:23px;position:relative}.location:before{background:url(../img/location.svg) center center no-repeat;background-size:contain;position:absolute;content:'';left:0;top:50%;width:18px;height:23px;margin-top:-11.5px}.btn{display:flex;justify-content:center;align-items:center;float:left;height:57px;background:#0D84FB;border-radius:8px;font-size:17px;color:#fff;font-family:'Roboto',sans-serif;font-weight:500;padding:0 30px;white-space:nowrap;position:relative}.btn.border-btn{background:none}.banner-section .buttons .btn.border-btn{border:1px solid rgba(255,255,255,.6)}.buttons{display:block;float:left}.buttons .btn{margin-right:20px}.buttons .btn:last-child{margin-right:0}.socials{display:block;float:left;width:auto}.socials .soc-link{width:32px;height:32px;border-radius:50%;background:#ebebeb;margin-right:13px;position:relative;display:flex;justify-content:center;align-items:center;float:left}.socials .soc-link:last-child{margin-right:0}.socials .soc-link img{max-width:18px;max-height:18px}@media screen and (max-width:1400px){.banner-section .wrap_float{min-height:630px}}@media screen and (max-width:590px){.banner-section .wrap_float{min-height:600px;padding:60px 0}}@media screen and (max-width:480px){.buttons{display:flex}.buttons .btn{padding:0 15px;width:100%}}</style>

<body class="transition-none">
    <div class="search-section">
        <div class="wrap">
            <div class="wrap_float">
                <div class="search-form" id="search">
                    <input type="text" class="search-input search" id="search-input" placeholder="Search…">
                    <button class="search-submit"></button>
					<ul id="results-container" style="color: white; padding-left: 20px; line-height: 1.2em;"></ul>
                </div>
                <div class="search-close" id="search-close"></div>
				</div>
				<script defer src="{{site.url}}/js/search-script.js" type="text/javascript"></script>
				<script defer>
				document.addEventListener('DOMContentLoaded', function() {
					SimpleJekyllSearch({
					  searchInput: document.getElementById('search-input'),
					  resultsContainer: document.getElementById('results-container'),
					  json: '{{site.url}}/search.json'
					})
				});
				</script>
            </div>
        </div>
    </div>
